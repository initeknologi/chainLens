services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chainlens
      POSTGRES_PASSWORD: chainlens
      POSTGRES_DB: chainlens
    ports:
      - "5432:5432"
    volumes:
      - chainlens_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainlens -d chainlens"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  chainlens_pg:
